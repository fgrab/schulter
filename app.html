/* Layout: eine Spalte, Handy zuerst. Routinen als Karten, Player als Vollbild-Ansicht mit großem Ring. */
:root {
  --bg: #EEF3F2;
  --surface: #FFFFFF;
  --surface-2: #E2EBE9;
  --ink: #142B2A;
  --muted: #586E6B;
  --line: #CFDCD9;
  --accent: #0E6B66;
  --accent-ink: #FFFFFF;
  --mobil: #2F6FA8;
  --dehnen: #8A4F9E;
  --kraft: #B0701A;
  --mobil-bg: #E3EDF7;
  --dehnen-bg: #F1E7F4;
  --kraft-bg: #F7EBDA;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --prop: #9DB3AF;
  --prop-fill: #D3E0DD;
  --wall: #E4ECEA;
  --band: #D9822B;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1918; --surface: #162524; --surface-2: #1E3230; --ink: #E3EEEC; --muted: #93AAA6;
    --line: #2A403E; --accent: #4CC2B7; --accent-ink: #062120;
    --mobil: #7FB4E6; --dehnen: #D29BE3; --kraft: #E8AE5C;
    --mobil-bg: #1A2C3D; --dehnen-bg: #2D1F33; --kraft-bg: #33271A;
    --prop: #4E6965; --prop-fill: #2A403E; --wall: #1A2B2A; --band: #F0A050;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1918; --surface: #162524; --surface-2: #1E3230; --ink: #E3EEEC; --muted: #93AAA6;
  --line: #2A403E; --accent: #4CC2B7; --accent-ink: #062120;
  --mobil: #7FB4E6; --dehnen: #D29BE3; --kraft: #E8AE5C;
  --mobil-bg: #1A2C3D; --dehnen-bg: #2D1F33; --kraft-bg: #33271A;
    --prop: #4E6965; --prop-fill: #2A403E; --wall: #1A2B2A; --band: #F0A050;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  display: flex; flex-direction: column; gap: 22px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 30px; line-height: 1.1; font-weight: 700; }
h2 { font-size: 20px; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

/* Kopf */
.head { display: flex; flex-direction: column; gap: 6px; }
.tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 999px; align-self: flex-start; }
.tabs button { border: 0; background: transparent; padding: 8px 16px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }

/* Ausrüstung */
.equip { display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 14px 8px 10px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px;
}
.chip .box { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--muted); display: grid; place-items: center; }
.chip[aria-pressed="true"] { border-color: var(--accent); }
.chip[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.chip[aria-pressed="true"] .box::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--accent-ink); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }

/* Routinen */
.routines { display: flex; flex-direction: column; gap: 10px; }
.rcard {
  display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; text-align: left; width: 100%;
}
.rcard:active { transform: scale(0.99); }
.ricon { width: 48px; height: 48px; border-radius: 12px; background: var(--surface-2); color: var(--accent); display: grid; place-items: center; }
.ricon svg { width: 26px; height: 26px; }
.rtext { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rtitle { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.rsub { font-size: 14px; color: var(--muted); }
.rtime { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; white-space: nowrap; text-align: right; }
.rtime small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }

/* Kategorie-Markierungen */
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; }
.tag.mobil { color: var(--mobil); background: var(--mobil-bg); }
.tag.dehnen { color: var(--dehnen); background: var(--dehnen-bg); }
.tag.kraft { color: var(--kraft); background: var(--kraft-bg); }
.etag { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); padding: 2px 7px; border-radius: 6px; }

.note { font-size: 14px; color: var(--muted); background: var(--surface-2); border-radius: var(--radius); padding: 12px 14px; }

/* Vorschau */
.back { border: 0; background: none; padding: 6px 0; color: var(--accent); font-weight: 600; align-self: flex-start; }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.plist li { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.plist .pname { font-weight: 600; min-width: 0; }
.plist .pinfo { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.plist .pmeta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.plist .pdur { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; text-align: right; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 700; font-size: 17px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1; }
.btn.ghost { background: var(--surface-2); }

/* Bibliothek */
.lib { display: flex; flex-direction: column; gap: 18px; }
.lib section { display: flex; flex-direction: column; gap: 8px; }
details.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
details.ex summary { list-style: none; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
details.ex summary::-webkit-details-marker { display: none; }
details.ex summary::after { content: "+"; font-size: 20px; color: var(--muted); }
details.ex[open] summary::after { content: "–"; }
details.ex .exbody { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.exname { font-weight: 600; min-width: 0; }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.tip { font-size: 14px; border-left: 3px solid var(--accent); padding-left: 10px; color: var(--muted); }

/* Player */
.player { min-height: 100%; display: flex; flex-direction: column; }
.player .wrap { flex: 1; gap: 16px; padding-block: 12px 24px; }
.ptop { display: flex; align-items: center; gap: 12px; }
.ptop .x { border: 0; background: var(--surface-2); width: 40px; height: 40px; border-radius: 50%; font-size: 20px; line-height: 1; flex: none; }
.segs { flex: 1; display: flex; gap: 4px; }
.segs span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.segs span.done { background: var(--accent); }
.segs span.now { background: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.pcount { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); font-weight: 600; flex: none; }
.phase { font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); min-height: 1.4em; }
.phase.prep { color: var(--muted); }
.pname { font-family: var(--font-display); font-size: 28px; line-height: 1.2; font-weight: 700; }
.pdose { font-weight: 600; }
.ring { position: relative; width: min(170px, 44vw); aspect-ratio: 1; max-width: 100%; align-self: center; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring .track { stroke: var(--surface-2); }
.ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.15s linear; }
.ring.prep .bar { stroke: var(--muted); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ring .side { position: absolute; left: 0; right: 0; bottom: 22%; text-align: center; font-size: 14px; font-weight: 700; color: var(--muted); }
.controls { display: flex; justify-content: center; align-items: center; gap: 22px; }
.cbtn { border: 0; background: var(--surface-2); width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; }
.cbtn.big { width: 76px; height: 76px; background: var(--accent); color: var(--accent-ink); }
.cbtn svg { width: 24px; height: 24px; }
.cbtn.big svg { width: 32px; height: 32px; }
.howto { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.nextup { font-size: 14px; color: var(--muted); }
.sound { border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 600; padding: 6px 0; align-self: center; }

/* Skizzen */
.sk { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; background: var(--surface-2); border-radius: 12px; overflow: hidden; }
.sk svg { width: 100%; height: 100%; display: block; }
.sk .fig { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.sk .far { stroke: var(--muted); }
.sk .hd { fill: var(--ink); }
.sk .pr { fill: none; stroke: var(--prop); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.sk .pr.thick { stroke-width: 6; }
.sk .mat, .sk .wall { fill: var(--wall); }
.sk .roll, .sk .blk { fill: var(--prop-fill); stroke: var(--prop); stroke-width: 2; }
.sk .band { fill: none; stroke: var(--band); stroke-width: 3.5; stroke-linecap: round; }
.sk .hl { fill: var(--accent); opacity: 0.25; }
.sk .arr { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
.sk .ahd { fill: var(--accent); }
.sk .cap { fill: var(--muted); font: 600 10px var(--font-body); }
.sk.two .f1 { animation: skA 3.6s ease-in-out infinite; }
.sk.two .f2 { animation: skB 3.6s ease-in-out infinite; }
@keyframes skA { 0%, 38% { opacity: 1; } 50%, 88% { opacity: 0; } 100% { opacity: 1; } }
@keyframes skB { 0%, 38% { opacity: 0; } 50%, 88% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .sk.two .f1 { animation: none; opacity: 0.3; }
  .sk.two .f2 { animation: none; opacity: 1; }
}
.sk.thumb { width: 64px; border-radius: 8px; }
.player .sk { max-height: 32vh; width: auto; align-self: center; }
.pstage { display: flex; flex-direction: column; gap: 14px; }

.done { text-align: center; align-items: center; justify-content: center; min-height: 70vh; }
.done .big { font-family: var(--font-display); font-size: 48px; font-weight: 700; }

@media (prefers-reduced-motion: reduce) { .ring .bar { transition: none; } .rcard:active { transform: none; } }
</style>

let skN = 0;
function sketch(id, mode) {
  const s = SK[id]; if (!s) return "";
  const n = ++skN;
  const two = s.fr.length > 1 && mode !== "thumb";
  const mk = `<defs><marker id="ah${n}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9z" class="ahd"/></marker></defs>`;
  const pose = (p, cls) => `<g class="${cls}">${p.f ? `<path class="fig far" d="${p.f}"/>` : ""}<path class="fig" d="${p.b}"/><circle class="hd" cx="${p.h[0]}" cy="${p.h[1]}" r="9"/>${p.x || ""}</g>`;
  const hl = s.hl ? `<ellipse class="hl" cx="${s.hl[0]}" cy="${s.hl[1]}" rx="${s.hl[2]}" ry="${s.hl[3]}"/>` : "";
  const ar = mode === "thumb" ? "" : s.ar.map(d => `<path class="arr" d="${d}" marker-end="url(#ah${n})"${s.both ? ` marker-start="url(#ah${n})"` : ""}/>`).join("");
  const frames = two ? pose(s.fr[0], "f1") + pose(s.fr[1], "f2") : pose(s.fr[s.fr.length - 1], "f0");
  return `<div class="sk ${two ? "two" : ""} ${mode || ""}" role="img" aria-label="Skizze: ${esc(EX[id].name)}"><svg viewBox="0 0 200 150">${mk}${s.pr}${hl}${frames}${ar}</svg></div>`;
}

// ---------- Auswahl ----------
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const has = id => !EX[id].equip || equip[EX[id].equip];
function today() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }

function build(r) {
  const rand = rng(hash(today() + r.id + shuffle));
  const used = new Set();
  return r.slots.map(s => {
    let pool = s.o.filter(id => has(id) && !used.has(id));
    if (!pool.length) pool = s.o.filter(has);
    const id = pool[Math.floor(rand() * pool.length)];
    used.add(id);
    return { id, ...EX[id], dur: s.d || EX[id].dur };
  }).filter(x => x.id);
}
const varies = r => r.slots.some(s => s.o.filter(has).length > 1);
function totalSec(list, r) {
  return list.reduce((t, e) => t + r.prep + (e.sides ? e.dur * 2 + SWITCH : e.dur), 0);
}
function fmtMin(s) { const m = s / 60; return m < 2 ? (Math.round(m * 2) / 2).toString().replace(".", ",") + " Min" : "≈ " + Math.round(m) + " Min"; }
function fmtDur(e) { return e.sides ? e.dur + " s je Seite" : e.dur + " s"; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- Ansichten ----------
const app = document.getElementById("app");
let view = { name: "home", tab: "routinen" };

function render() {
  if (view.name !== "player") releaseWake();
  if (view.name === "home") return renderHome();
  if (view.name === "preview") return renderPreview();
  if (view.name === "player") return renderPlayer();
  if (view.name === "done") return renderDone();
}

function equipHtml() {
  return `<div class="equip"><span class="eyebrow">Was hast du da?</span><div class="chips">` +
    Object.entries(EQUIP).map(([k, l]) => `<button class="chip" data-equip="${k}" aria-pressed="${!!equip[k]}"><span class="box"></span>${l}</button>`).join("") +
    `</div></div>`;
}

function renderHome() {
  const tabs = `<div class="tabs" role="tablist">
      <button role="tab" data-tab="routinen" aria-selected="${view.tab === "routinen"}">Routinen</button>
      <button role="tab" data-tab="uebungen" aria-selected="${view.tab === "uebungen"}">Alle Übungen</button></div>`;
  let body;
  if (view.tab === "routinen") {
    body = equipHtml() + `<div class="routines">` + ROUTINES.map(r => {
      const list = build(r);
      return `<button class="rcard" data-routine="${r.id}">
        <span class="ricon">${ICONS[r.icon]}</span>
        <span class="rtext"><span class="rtitle">${r.name}</span><span class="rsub">${r.sub}</span></span>
        <span class="rtime">${fmtMin(totalSec(list, r))}<small>${list.length} Übungen</small></span></button>`;
    }).join("") + `</div>
    <p class="note">Dehnen soll ziehen, aber nicht wehtun. Bei Kribbeln, ausstrahlenden oder anhaltenden Schmerzen die Übung abbrechen und ärztlich oder physiotherapeutisch abklären lassen.</p>`;
  } else {
    body = `<div class="lib">` + Object.entries(CATS).map(([c, label]) => `<section><h2>${label}</h2>` +
      Object.entries(EX).filter(([, e]) => e.cat === c).map(([id, e]) => `<details class="ex">
        <summary><span class="exname">${esc(e.name)}</span></summary>
        <div class="exbody">
          ${sketch(id)}
          <div class="row" style="gap:6px"><span class="tag ${e.cat}">${CATS[e.cat]}</span><span class="etag">${esc(e.pos)}</span>${e.equip ? `<span class="etag">${EQUIP[e.equip]}</span>` : ""}<span class="etag">${fmtDur(e)}</span></div>
          <p class="muted">${esc(e.area)}${e.dose ? " · " + esc(e.dose) : ""}</p>
          <ol class="steps">${e.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
          ${e.tip ? `<p class="tip">${esc(e.tip)}</p>` : ""}
        </div></details>`).join("") + `</section>`).join("") + `</div>`;
  }
  app.innerHTML = `<div class="wrap">
    <header class="head"><span class="eyebrow">Schulter & Nacken</span><h1>Katjas Schulterpause</h1>
    <p class="muted">Kurze Routinen gegen Schreibtisch- und Lenkerhaltung.</p></header>
    ${tabs}${body}</div>`;
}

function renderPreview() {
  const r = ROUTINES.find(x => x.id === view.rid);
  const list = view.list;
  app.innerHTML = `<div class="wrap">
    <button class="back" data-act="home">← Übersicht</button>
    <header class="head"><span class="eyebrow">${r.target} · ${list.length} Übungen</span><h1>${r.name}</h1><p class="muted">${r.sub}</p></header>
    <ul class="plist">${list.map(e => `<li>${sketch(e.id, "thumb")}
      <div class="pinfo"><span class="pname">${esc(e.name)}</span>
      <span class="pmeta"><span class="tag ${e.cat}">${CATS[e.cat]}</span><span class="etag">${esc(e.pos)}</span>${e.equip ? `<span class="etag">${EQUIP[e.equip]}</span>` : ""}</span></div><span class="pdur">${fmtDur(e)}</span></li>`).join("")}</ul>
    <p class="muted">Dauer insgesamt ${fmtMin(totalSec(list, r))}</p>
    <div class="row">
      ${varies(r) ? `<button class="btn ghost" data-act="shuffle">Andere Auswahl</button>` : ""}
      <button class="btn primary" data-act="start">Starten</button>
    </div></div>`;
}

// ---------- Player ----------
let P = null; // { r, list, phases, i, end, left, paused, timer }
function makePhases(r, list) {
  const ph = [];
  list.forEach((e, ei) => {
    ph.push({ type: "prep", ei, dur: r.prep });
    if (e.sides) {
      ph.push({ type: "work", ei, dur: e.dur, side: "Linke Seite" });
      ph.push({ type: "switch", ei, dur: SWITCH });
      ph.push({ type: "work", ei, dur: e.dur, side: "Rechte Seite" });
    } else ph.push({ type: "work", ei, dur: e.dur });
  });
  return ph;
}
function startPlayer() {
  initAudio();
  const r = ROUTINES.find(x => x.id === view.rid);
  P = { r, list: view.list, phases: makePhases(r, view.list), i: 0, paused: false, lastBeep: null, started: Date.now() };
  P.end = performance.now() + P.phases[0].dur * 1000;
  view = { name: "player", rid: r.id };
  requestWake();
  renderPlayer();
  clearInterval(P.timer);
  P.timer = setInterval(tick, 100);
}
function stopPlayer() { if (P) clearInterval(P.timer); P = null; releaseWake(); }
function remaining() { return P.paused ? P.left : Math.max(0, P.end - performance.now()); }
function goPhase(i) {
  if (i >= P.phases.length) { beep(880, 0.15); setTimeout(() => beep(1175, 0.25), 180); vibrate([120, 80, 120]);
    const secs = Math.round((Date.now() - P.started) / 1000); stopPlayer(); view = { name: "done", secs }; return render(); }
  P.i = Math.max(0, i); P.lastBeep = null;
  const d = P.phases[P.i].dur * 1000;
  if (P.paused) P.left = d; else P.end = performance.now() + d;
  const ph = P.phases[P.i];
  if (ph.type === "work") { beep(988, 0.18); vibrate(80); }
  if (ph.type === "switch") { beep(660, 0.12); vibrate([60, 60, 60]); }
  renderPlayer();
}
function tick() {
  if (!P || P.paused) return;
  const rem = remaining();
  const s = Math.ceil(rem / 1000);
  if (s <= 3 && s >= 1 && P.lastBeep !== s) { P.lastBeep = s; beep(520, 0.07); }
  if (rem <= 0) return goPhase(P.i + 1);
  updateClock();
}
function exStart(ei) { return P.phases.findIndex(p => p.ei === ei); }
function updateClock() {
  const ph = P.phases[P.i];
  const rem = remaining();
  const num = app.querySelector(".ring .num"), bar = app.querySelector(".ring .bar");
  if (!num) return;
  num.textContent = Math.ceil(rem / 1000);
  const C = 2 * Math.PI * 54;
  bar.style.strokeDashoffset = (C * (1 - rem / (ph.dur * 1000))).toFixed(1);
}
const IC = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5.5v13L9.5 12z"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5.5v13L14.5 12z"/></svg>',
};
function renderPlayer() {
  if (!P) return;
  const ph = P.phases[P.i], e = P.list[ph.ei], next = P.list[ph.ei + 1];
  const C = 2 * Math.PI * 54;
  const phaseLabel = ph.type === "prep" ? (ph.ei === 0 ? "Bereit machen" : "Gleich geht's weiter") : ph.type === "switch" ? "Seitenwechsel" : (ph.side || "Los geht's");
  const sideLabel = ph.type === "switch" ? "gleich rechts" : ph.type === "prep" && e.sides ? "links beginnen" : (ph.side || "");
  app.innerHTML = `<div class="player"><div class="wrap">
    <div class="ptop"><button class="x" data-act="quit" aria-label="Beenden">×</button>
      <div class="segs">${P.list.map((_, k) => `<span class="${k < ph.ei ? "done" : k === ph.ei ? "now" : ""}"></span>`).join("")}</div>
      <span class="pcount">${ph.ei + 1}/${P.list.length}</span></div>
    <div><p class="phase ${ph.type !== "work" ? "prep" : ""}">${phaseLabel}</p>
      <h2 class="pname">${esc(e.name)}</h2>
      <p class="muted">${esc(e.pos)} · ${esc(e.area)}</p>
      ${e.dose ? `<p class="pdose">${esc(e.dose)}</p>` : ""}</div>
    <div class="pstage">${sketch(e.id)}
    <div class="ring ${ph.type !== "work" ? "prep" : ""}">
      <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54"/><circle class="bar" cx="60" cy="60" r="54" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="0"/></svg>
      <span class="num">${Math.ceil(remaining() / 1000)}</span><span class="side">${sideLabel}</span></div></div>
    <div class="controls">
      <button class="cbtn" data-act="prev" aria-label="Vorherige Übung">${IC.prev}</button>
      <button class="cbtn big" data-act="pause" aria-label="${P.paused ? "Weiter" : "Pause"}">${P.paused ? IC.play : IC.pause}</button>
      <button class="cbtn" data-act="next" aria-label="Nächste Übung">${IC.next}</button></div>
    <button class="sound" data-act="sound">Ton ${sound ? "an" : "aus"}</button>
    <div class="howto"><ol class="steps">${e.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>${e.tip ? `<p class="tip">${esc(e.tip)}</p>` : ""}</div>
    <p class="nextup">${next ? "Danach: " + esc(next.name) : "Das ist die letzte Übung."}</p>
  </div></div>`;
  updateClock();
}
function renderDone() {
  const m = Math.floor(view.secs / 60), s = view.secs % 60;
  app.innerHTML = `<div class="wrap done"><p class="eyebrow">Geschafft</p><p class="big">${m}:${String(s).padStart(2, "0")}</p>
    <p class="muted">Minuten für Schultern und Nacken. Gut gemacht, Katja.</p>
    <button class="btn primary" data-act="home" style="flex:none">Zur Übersicht</button></div>`;
}

// ---------- Ton, Vibration, Bildschirm ----------
let ac = null;
function initAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch {} }
function beep(f, len) {
  if (!sound || !ac) return;
  try { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; o.type = "sine";
    g.gain.setValueAtTime(0.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.25, ac.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + len); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + len + 0.02); } catch {}
}
function vibrate(p) { try { if (sound && navigator.vibrate) navigator.vibrate(p); } catch {} }
let wake = null;
async function requestWake() { try { wake = await navigator.wakeLock?.request("screen"); } catch {} }
function releaseWake() { try { wake?.release(); } catch {} wake = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && P && !wake) requestWake(); });

// ---------- Bedienung ----------
app.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.dataset.tab) { view.tab = t.dataset.tab; return render(); }
  if (t.dataset.equip) { const k = t.dataset.equip; equip[k] = !equip[k]; store.set("equip", equip); return render(); }
  if (t.dataset.routine) { shuffle = 0; const r = ROUTINES.find(x => x.id === t.dataset.routine);
    view = { name: "preview", rid: r.id, list: build(r) }; window.scrollTo(0, 0); return render(); }
  const a = t.dataset.act;
  if (a === "home") { stopPlayer(); view = { name: "home", tab: "routinen" }; window.scrollTo(0, 0); return render(); }
  if (a === "shuffle") { shuffle++; const r = ROUTINES.find(x => x.id === view.rid); view.list = build(r); return render(); }
  if (a === "start") { window.scrollTo(0, 0); return startPlayer(); }
  if (!P) return;
  if (a === "quit") { stopPlayer(); view = { name: "home", tab: "routinen" }; return render(); }
  if (a === "pause") { if (P.paused) { P.end = performance.now() + P.left; P.paused = false; initAudio(); } else { P.left = remaining(); P.paused = true; } return renderPlayer(); }
  if (a === "next") { const ei = P.phases[P.i].ei; const j = exStart(ei + 1); return goPhase(j === -1 ? P.phases.length : j); }
  if (a === "prev") { const ei = P.phases[P.i].ei; const s = exStart(ei); const elapsed = P.i > s + 1 || (P.phases[P.i].dur * 1000 - remaining()) > 3000;
    return goPhase(elapsed || ei === 0 ? s : exStart(ei - 1)); }
  if (a === "sound") { sound = !sound; store.set("sound", sound); if (sound) initAudio(); return renderPlayer(); }
});

render();
})();
</script>
